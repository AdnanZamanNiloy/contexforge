<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContextForge Docs</title>
    <meta
      name="description"
      content="ContextForge documentation — a grounded, local-first RAG workspace with cited answers."
    />
    <!--
      Paint the page black before the stylesheet and bundle load.  Without this
      the browser shows its default white canvas for the first frames — the
      white flash on navigation.  Inline and in <head> so it applies on the
      very first paint; the value matches --docs-canvas / the app's --canvas.
    -->
    <style>
      html {
        background-color: #101010;
        color-scheme: dark;
      }
    </style>
    <!-- Same favicon set as the main app (frontend/index.html). Relative paths
         (no leading slash) so they resolve under both the dev root and the
         `/docs/` base the deployed build uses. -->
    <link rel="icon" type="image/svg+xml" href="logos/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3" />
    <link rel="shortcut icon" href="favicon.ico?v=3" />
    <!-- Same type stack as the main app. Preconnected and loaded async: the
         page paints immediately on the fallback stack and swaps to Inter when
         it arrives, instead of blocking first paint on a third-party request.
         That is the delay — and the reflow — on a cold open. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
