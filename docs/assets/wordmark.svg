<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1438 201" width="1438" height="201" role="img" aria-label="ContextForge">
  <title>ContextForge</title>
  <!--
    The README wordmark: the mark from public/logos/contextforge-mark.svg beside
    the product name, set in Inter at the brand weight so the lettering is the
    same typeface the app renders rather than a lookalike.

    Colours are the app tokens verbatim: the ink token for "Context" and the
    primary token for "Forge", which is what LandingPage does with its
    .lp-brand-accent class. The mark geometry is identical to the component and
    to the favicon.

    Lettering is scaled so the cap height equals the 140 unit plate, and the
    plate is aligned to the cap band rather than to the text bounding box, so the
    descender on the g does not push the wordmark out of balance.

    The glyphs are real Inter outlines, extracted with fontTools, so this renders
    identically wherever the font itself might not be installed.

    Avoid double hyphens in this comment: XML forbids them and a browser
    loading this file through an img element parses it as strict XML.
  -->
  <style>
    /*
      "Forge" is the primary token verbatim in both themes, 3.97:1 on white,
      which is fine for a large lockup and keeps the brand exact.

      "Context" is the ink token, which is a dark theme colour: exact on a dark
      README at 16.9:1, but 1.12:1 on a light one, i.e. invisible. The light
      override is the same ink darkened to hold 9.8:1, so the wordmark is
      legible in both rather than exact in one and unreadable in the other.
    */
    .wf-light { fill: #f2f2f2; }
    .wf-accent { fill: #4377fd; }
    @media (prefers-color-scheme: light) {
      .wf-light { fill: #3d4451; }
    }
  </style>

  <defs>
    <linearGradient id="cf-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b92ff"/>
      <stop offset="100%" stop-color="#2f5fe0"/>
    </linearGradient>
  </defs>

  <g>
    <rect x="0" y="0" width="140" height="140" rx="32" fill="url(#cf-badge)"/>
    <rect x="30" y="34" width="80" height="16" rx="4" fill="#FFFFFF"/>
    <rect x="57" y="50" width="26" height="34" rx="3" fill="#FFFFFF"/>
    <rect x="38" y="84" width="64" height="20" rx="4" fill="#FFFFFF"/>
