<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 140" width="1350" height="140" role="img" aria-label="ContextForge — a grounded AI workspace for retrieval-augmented generation">
  <title>ContextForge</title>
  <!--
    Horizontal lockup: the mark beside the wordmark, for the README header.
    "Context" is drawn as vector paths rather than <text> so the wordmark renders
    identically whatever fonts the renderer has, and "Forge" repeats the same
    glyphs in the workspace blue.
  -->
  <defs>
    <linearGradient id="cf-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b92ff"/>
      <stop offset="100%" stop-color="#2f5fe0"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 0)">
